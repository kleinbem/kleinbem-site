name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    permissions:
      pull-requests: read
    uses: kleinbem/actions/.github/workflows/dependabot-auto-merge.yaml@b3ffb6b2eeb888969e5f16640c84a55956581542 # v1.9.0
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
