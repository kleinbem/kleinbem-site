name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: kleinbem/actions/.github/workflows/zizmor.yaml@a1647881d0d61e4d5b299a054c3ec1e0ace1ebba # v1.2.2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # No cache: PR runs could plant packages the main deploy restores.
          package-manager-cache: false
      - run: npm ci
      - run: npm run build

      # Pages ignores dashboard/Terraform env vars once wrangler.jsonc sets
      # pages_build_output_dir, so secrets are pushed on every deploy
      # (nix/infra/cloudflare-pages.tf has the background).
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTHENTIK_CLIENT_SECRET: ${{ secrets.AUTHENTIK_CLIENT_SECRET }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          printf '%s' "$AUTHENTIK_CLIENT_SECRET" | npx wrangler pages secret put AUTHENTIK_CLIENT_SECRET --project-name=kleinbem-site
          printf '%s' "$AUTH_SESSION_SECRET" | npx wrangler pages secret put AUTH_SESSION_SECRET --project-name=kleinbem-site
          printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler pages secret put TURNSTILE_SECRET_KEY --project-name=kleinbem-site
          # No RESEND_API_KEY yet, so the contact form stays hidden. Adding it here
          # (and to the repo secrets) shows the form from the next deploy on.

      # Deploys to the live www.kleinbem.dev Pages project, main only. No
      # wranglerVersion: unset, the action uses the lockfile's wrangler.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=kleinbem-site --branch=main
