name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Only on main, not PRs — this pushes straight to the live
      # www.kleinbem.dev Pages project (see nix/infra/cloudflare-pages.tf).
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action's own default (3.90.0) peer-conflicts with
          # @cloudflare/workers-types v5 (needed for the PagesFunction type in
          # functions/api/contact.ts) — its peer dep wants ^4.x. Pin the
          # actual current wrangler major instead of downgrading the types.
          wranglerVersion: "4"
          command: pages deploy .svelte-kit/cloudflare --project-name=kleinbem-site --branch=main
